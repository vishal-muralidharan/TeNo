schema_version: 2
project:
  name: teno
  mode: existing
  platforms:
  - web
  summary: Minimalist focus browser and workspace application with web dashboard and
    Chrome extension.
stack:
  language: javascript
  framework: React
  bundler: Vite
  styling: css
  router: React Router
  package_manager: npm
  database: Firebase
  test_runner: Vitest
design:
  enabled: true
  tokens_file: teno-web/src/index.css
  component_dirs:
  - teno-web/src/components
responsive:
  enabled: false
commands:
  check: cd teno-web && npm run test
  test: cd teno-web && npm run test
structure:
  layers:
  - path: teno-web/src
    purpose: Web application components, contexts, and pages
  - path: teno-extension/src
    purpose: Chrome extension popup and background scripts
  - path: migrations
    purpose: Database schema and migration scripts
  root_allowed:
  - firebase.json
  - firestore.rules
  - firestore.indexes.json
  - .firebaserc
  tests: tests-dir
naming:
- item: Components
  style: PascalCase
  example: PromptCard.jsx
git:
  push: never
  commit_format: '<type>(<scope>): <subject>'
  workflow:
    default_branch: master
  scopes:
  - name: agents
    paths:
    - .agents/**
    - AGENTS.md
    purpose: Build Forge pipeline and agent configuration
  - name: web
    paths:
    - teno-web/**
    purpose: Web dashboard application
  - name: extension
    paths:
    - teno-extension/**
    purpose: Chrome extension implementation
  - name: firebase
    paths:
    - firebase.json
    - firestore.rules
    - firestore.indexes.json
    purpose: Firebase config and rules
docs:
  skills_dir: .agents/skills
  repo_map: README.md
  agents_file: AGENTS.generated.md
blueprints:
  dir: .agents/blueprints
  enabled: true
  areas:
  - ui
  - data
  - tokens
  - layout
rules:
- id: a11y-semantic-html
  area: design
  text: Use semantic HTML elements instead of generic divs with click handlers.
  enforced_by: manual
  pack: a11y-basics@1
- id: a11y-visible-focus
  area: design
  text: Interactive elements must display high-contrast visible focus indicators.
  enforced_by: manual
  pack: a11y-basics@1
- id: a11y-aa-contrast
  area: design
  text: Text and interactive controls must meet WCAG AA contrast standards.
  enforced_by: manual
  pack: a11y-basics@1
- id: a11y-icon-button-labels
  area: design
  text: Icon-only controls must provide an accessible text label.
  enforced_by: manual
  pack: a11y-basics@1
- id: a11y-img-has-alt
  area: design
  text: Image tags must include an alt attribute on the same tag line.
  enforced_by: test
  check:
    type: forbid
    pattern: <img\b(?![^>]*\balt\s*=)[^>]*>
    include:
    - '**/*.html'
    - '**/*.htm'
    - src/**/*.{jsx,tsx,vue,svelte,html}
    hint: Add an alt attribute to the img tag. Use alt="" for decorative images.
    examples:
      bad:
      - <img src="/hero.png">
      - <img src="avatar.jpg" className="avatar" />
      good:
      - <img src="/hero.png" alt="Company logo" />
      - <img src="decoration.svg" alt="" />
      - <Image src="/hero.png" />
  pack: a11y-basics@1
- id: motion-respect-reduced
  area: motion
  text: Transitions and animations must respect prefers-reduced-motion media queries.
  enforced_by: manual
  pack: motion-basics@1
- id: motion-transform-opacity-only
  area: motion
  text: Smooth animations must target transform and opacity properties only.
  enforced_by: manual
  pack: motion-basics@1
- id: motion-no-transition-all
  area: motion
  text: 'Never use transition: all in stylesheets; target explicit CSS properties
    instead.'
  enforced_by: test
  check:
    type: forbid
    pattern: (?<![\w-])transition\s*:\s*all\b
    include:
    - src/**/*.{css,scss,sass,less,jsx,tsx,vue,svelte}
    hint: Specify individual transition properties like transform or opacity instead
      of all.
    examples:
      bad:
      - 'transition: all 0.2s ease;'
      - '  transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);'
      good:
      - 'transition: transform 0.2s ease, opacity 0.2s ease;'
      - 'transition: color 150ms ease-in-out;'
  pack: motion-basics@1
- id: ui-no-native-pickers
  area: design
  text: Never use native browser date, time, month, week, datetime-local, or color
    inputs instead of the project's themed picker primitives.
  enforced_by: test
  check:
    type: forbid
    pattern: (?<![\w-])type\s*=\s*(?:\{\s*)?["\x27\x60](?:date|time|color|datetime-local|month|week)["\x27\x60]
    include:
    - src/**/*.{js,jsx,ts,tsx,vue,svelte,html}
    exclude:
    - teno-web/src/components/**
    hint: Use the project's themed picker primitive instead of native date/time/color
      inputs.
    examples:
      bad:
      - <input type="date">
      - <input type={'time'}>
      - <input type="color">
      - <Input type="date" />
      - <input type={`datetime-local`} />
      good:
      - <DatePicker>
      - <input type="text">
      - <input type="checkbox">
      - <Input type="email">
      - <input type={inputType}>
  pack: native-controls@1
- id: ui-no-native-selects
  area: design
  text: Never use native browser select elements instead of the project's themed Select
    primitive.
  enforced_by: test
  check:
    type: forbid
    pattern: <select\b
    include:
    - src/**/*.{js,jsx,ts,tsx,vue,svelte,html}
    exclude:
    - teno-web/src/components/**
    hint: Use the themed Select primitive instead of a native select element.
    examples:
      bad:
      - <select>
      - <select name="country">
      - <select className="styled-select">
      good:
      - <Select>
      - <Select name="country">
      - <CustomSelect options={options} />
  pack: native-controls@1
- id: ui-no-browser-dialogs
  area: design
  text: Never use window alert, confirm, or prompt instead of the project's dialog
    and toast primitives.
  enforced_by: test
  check:
    type: forbid
    pattern: (?<![\w.$])(?:window\.)?(?:alert|confirm|prompt)\s*\(
    include:
    - src/**/*.{js,jsx,ts,tsx,vue,svelte,html}
    exclude:
    - '**/*.test.*'
    - '**/*.spec.*'
    - src/test/**
    hint: Use a themed modal dialog or toast notification instead of window alert,
      confirm, or prompt.
    examples:
      bad:
      - alert("x")
      - confirm('y')
      - prompt(`z`)
      - window.confirm("Are you sure?");
      good:
      - <ConfirmDialog />
      - dialog.alert("Action completed");
      - 'confirmModal.open({ title: "Confirm" });'
      - toast.success("Saved");
  pack: native-controls@1
- id: ui-state-loading-skeleton
  area: design
  text: Loading views must use skeleton blocks matching content shape with no layout
    shift.
  enforced_by: manual
  pack: ui-states@1
- id: ui-state-empty-action
  area: design
  text: Empty states must display an icon, 1 or 2 descriptive words, and an action.
  enforced_by: manual
  pack: ui-states@1
- id: ui-state-error-alert
  area: design
  text: Error views must display a short message with an icon and role="alert".
  enforced_by: manual
  pack: ui-states@1
quality_gates:
- Navigate through the entire interface using only the Tab and Shift+Tab keys.
- Inspect focus outlines in high contrast mode.
- Enable prefers-reduced-motion in operating system settings and verify animations
  stop or fade.
- Inspect animation performance in DevTools to ensure zero dropped frames.
- Confirm form controls match project visual design tokens in both light and dark
  modes.
- Confirm dialogs trap focus and close cleanly with the Escape key.
- Simulate slow network and verify skeleton dimensions match loaded content.
- Trigger an empty collection and verify the primary creation button is visible.
- Trigger an API failure and confirm the error banner announces via screen readers.
rule_packs:
- id: a11y-basics
  version: 1
- id: motion-basics
  version: 1
- id: native-controls
  version: 1
- id: ui-states
  version: 1
